name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Lint
        run: selene src tests examples

      - name: Check formatting
        run: stylua --check src tests examples

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Download Roblox type definitions
        run: curl -fsSL -o roblox.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau

      - name: Type check
        run: luau-lsp analyze --definitions=roblox.d.luau src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Run tests
        run: lune run tests/run.luau
